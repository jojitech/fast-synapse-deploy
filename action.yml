name: Fast Synapse Deploy
description: Deploy Azure Synapse artifacts, ~fast~!
author: Shawn McGough (jojitech)
branding:
  icon: 'chevrons-right'
  color: 'blue'

inputs:
  template:
    description: 'Path to the Synapse template file (relative to repository root)'
    required: true
  parameters:
    description: 'Path to the Synapse parameters file (relative to repository root)'
    required: true
  subscription-id:
    description: 'Azure Subscription ID'
    required: true
  resource-group:
    description: 'Azure Resource Group name'
    required: true
  workspace-name:
    description: 'Azure Synapse Workspace name'
    required: true
  delete-artifacts:
    description: 'Delete artifacts after deployment (true/false)'
    required: false
    default: 'true'
  override-parameters:
    description: 'Override parameters (-key1 value1 -key2 value2)'
    required: false
  hash-check:
    description: 'Enable hash-based change detection (true/false)'
    required: false
    default: 'true'
  selective:
    description: 'Only deploy artifacts that differ from the current state (true/false)'
    required: false
    default: 'true'
  dry-run:
    description: 'Preview changes without actually deploying (true/false)'
    required: false
    default: 'false'
  disable-telemetry:
    description: 'Disable anonymous usage telemetry (true/false). See README for details on what is collected.'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - name: Anonymous Telemetry
      if: inputs.disable-telemetry != 'true'
      shell: bash
      env:
        TELEMETRY_REPO: ${{ github.repository }}
        TELEMETRY_ACTION_REF: ${{ github.action_ref }}
        TELEMETRY_DRY_RUN: ${{ inputs.dry-run }}
        TELEMETRY_SELECTIVE: ${{ inputs.selective }}
        TELEMETRY_HASH_CHECK: ${{ inputs.hash-check }}
      run: |
        chmod +x "${{ github.action_path }}/scripts/telemetry.sh"
        "${{ github.action_path }}/scripts/telemetry.sh"
      continue-on-error: true

    - name: Star Reminder
      if: inputs.disable-telemetry == 'true'
      shell: bash
      run: |
        echo "::notice::Telemetry is disabled. If you find Fast Synapse Deploy useful, please consider starring it on the GitHub Marketplace: https://github.com/marketplace/actions/fast-synapse-deploy"
      continue-on-error: true

    - name: Deploy from Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        OVERRIDE_PARAMS: ${{ inputs.override-parameters }}
      run: |
        chmod +x ${{ github.action_path }}/src/SynapseDeploy
        ${{ github.action_path }}/src/SynapseDeploy \
          ${{ inputs.selective == 'true' && '--selective' || '' }} \
          ${{ inputs.hash-check == 'true' && '--hash-check' || '' }} \
          ${{ inputs.dry-run == 'true' && '--dry-run' || '' }} \
          "${{ github.workspace }}/${{ inputs.template }}" \
          "${{ github.workspace }}/${{ inputs.parameters }}" \
          "${{ inputs.subscription-id }}" \
          "${{ inputs.resource-group }}" \
          "${{ inputs.workspace-name }}" \
          ${{ inputs.delete-artifacts == 'true' && 'true' || 'false' }} \
          "$OVERRIDE_PARAMS"
    - name: Deploy from Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        OVERRIDE_PARAMS: ${{ inputs.override-parameters }}
      run: |
        $deleteArtifacts = if ("${{ inputs.delete-artifacts }}" -eq "true") { "true" } else { "false" }
        $selectiveFlag = if ("${{ inputs.selective }}" -eq "true") { "--selective" } else { "" }
        $hashCheckFlag = if ("${{ inputs.hash-check }}" -eq "true") { "--hash-check" } else { "" }
        $dryRunFlag = if ("${{ inputs.dry-run }}" -eq "true") { "--dry-run" } else { "" }
        & "${{ github.action_path }}/src/SynapseDeploy.exe" `
          $selectiveFlag `
          $hashCheckFlag `
          $dryRunFlag `
          "${{ github.workspace }}/${{ inputs.template }}" `
          "${{ github.workspace }}/${{ inputs.parameters }}" `
          "${{ inputs.subscription-id }}" `
          "${{ inputs.resource-group }}" `
          "${{ inputs.workspace-name }}" `
          $deleteArtifacts `
          $env:OVERRIDE_PARAMS